<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ksef-bridge{% endblock %}</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        :root { --fg:#1a1a1a; --bg:#fafafa; --card:#fff; --line:#ddd; --accent:#0b5fff; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; margin:0; color:var(--fg); background:var(--bg); }
        header { background:#fff; border-bottom:1px solid var(--line); padding:.6rem 1.2rem;
                 display:flex; gap:1.2rem; align-items:center; flex-wrap:wrap; }
        header a { text-decoration:none; color:var(--fg); font-weight:500; }
        header a.active { color:var(--accent); }
        .env-banner { padding:.3rem 1.2rem; font-weight:600; text-align:center; }
        .env-test { background:#e6f4e6; color:#1b5e20; }
        .env-demo { background:#fff3cd; color:#7a5b00; }
        .env-prod { background:#c62828; color:#fff; }
        main { max-width:1200px; margin:1.2rem auto; padding:0 1.2rem; }
        table { border-collapse:collapse; width:100%; background:var(--card); }
        th, td { border:1px solid var(--line); padding:.4rem .6rem; text-align:left; font-size:.92rem; }
        th { background:#f0f0f0; }
        td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
        .badge { display:inline-block; padding:.1rem .5rem; border-radius:.7rem; font-size:.8rem; }
        .b-accepted { background:#e6f4e6; color:#1b5e20; }
        .b-sent, .b-queued { background:#e3f2fd; color:#0d47a1; }
        .b-rejected, .b-error { background:#fde3e3; color:#b71c1c; }
        .b-duplicate { background:#fff3cd; color:#7a5b00; }
        .b-blocked { background:#eee; color:#555; }
        .b-new { background:#e3f2fd; color:#0d47a1; }
        .b-exported { background:#e6f4e6; color:#1b5e20; }
        .b-needs_contractor { background:#fff3cd; color:#7a5b00; }
        .b-already_in_optima { background:#eee; color:#555; }
        button, .btn { background:var(--accent); color:#fff; border:none; padding:.45rem .9rem;
                 border-radius:.3rem; cursor:pointer; font-size:.92rem; text-decoration:none; }
        button:disabled { background:#aaa; cursor:not-allowed; }
        button.danger { background:#c62828; }
        .card { background:var(--card); border:1px solid var(--line); border-radius:.4rem;
                padding:1rem 1.2rem; margin-bottom:1rem; }
        .error-text { color:#b71c1c; font-size:.85rem; }
        .muted { color:#777; font-size:.85rem; }
        form.inline { display:inline; }
        input[type=date], input[type=text], select { padding:.35rem; border:1px solid var(--line);
                border-radius:.3rem; }
    </style>
</head>
<body>
{% set env = context.cfg.ksef.environment %}
<div class="env-banner env-{{ env }}">
    Srodowisko KSeF: {{ env | upper }}{% if env == 'prod' %} — WYSYLKA PRODUKCYJNA{% endif %}
</div>
<header>
    <strong>ksef-bridge</strong>
    <a href="/?c={{ company_id }}" {% if active == 'dashboard' %}class="active"{% endif %}>Pulpit</a>
    <a href="/sales?c={{ company_id }}" {% if active == 'sales' %}class="active"{% endif %}>Sprzedaz</a>
    <a href="/purchases?c={{ company_id }}" {% if active == 'purchases' %}class="active"{% endif %}>Zakupy</a>
    <a href="/settings?c={{ company_id }}" {% if active == 'settings' %}class="active"{% endif %}>Ustawienia</a>
    <a href="/audit?c={{ company_id }}" {% if active == 'audit' %}class="active"{% endif %}>Audyt</a>
    <span style="margin-left:auto">
        <form method="get" action="{{ request.url.path }}" class="inline">
            <select name="c" onchange="this.form.submit()">
                {% for cid, comp in context.cfg.companies.items() %}
                <option value="{{ cid }}" {% if cid == company_id %}selected{% endif %}>
                    {{ comp.name }} ({{ comp.nip }})
                </option>
                {% endfor %}
            </select>
        </form>
    </span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
